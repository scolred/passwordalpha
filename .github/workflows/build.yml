
name: Build KeePass plugin

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore KeePass API from NuGet
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $probeDir = Join-Path $env:RUNNER_TEMP "KeePassPackageProbe"
          $packagesDir = Join-Path $env:RUNNER_TEMP "nuget-packages"
          $probeProject = Join-Path $probeDir "KeePassPackageProbe.csproj"

          New-Item -ItemType Directory -Path $probeDir -Force | Out-Null

          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net48</TargetFramework>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="KeePass" Version="2.58.0" />
            </ItemGroup>
          </Project>
          '@ | Set-Content -Path $probeProject -Encoding utf8

          Write-Host "Restoring KeePass 2.58.0 from NuGet..."

          dotnet restore "$probeProject" --packages "$packagesDir" --verbosity minimal

          if ($LASTEXITCODE -ne 0) {
            throw "NuGet restore failed with exit code $LASTEXITCODE"
          }

          $packageDir = Join-Path $packagesDir "keepass\2.58.0"

          if (-not (Test-Path $packageDir)) {
            throw "KeePass NuGet package directory not found: $packageDir"
          }

          $exe = Get-ChildItem -Path $packageDir -Filter "KeePass.exe" -File -Recurse |
            Select-Object -First 1

          $lib = Get-ChildItem -Path $packageDir -Filter "KeePassLib.dll" -File -Recurse |
            Select-Object -First 1

          if (-not $exe) {
            throw "KeePass.exe not found in the restored package."
          }

          if (-not $lib) {
            throw "KeePassLib.dll not found in the restored package."
          }

          $keepassDir = Join-Path $env:RUNNER_TEMP "KeePassBuildReferences"
          New-Item -ItemType Directory -Path $keepassDir -Force | Out-Null

          Copy-Item -Path $exe.FullName -Destination $keepassDir -Force
          Copy-Item -Path $lib.FullName -Destination $keepassDir -Force

          "KeePassDir=$keepassDir" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "KeePass API references prepared successfully."
          Write-Host "KeePassDir=$keepassDir"

      - name: Build plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:KeePassDir) {
            throw "KeePassDir is not set."
          }

          if (-not (Test-Path ".\PasswordAlphabetHighlighter.csproj")) {
            throw "PasswordAlphabetHighlighter.csproj not found in repository root."
          }

          if (-not (Test-Path (Join-Path $env:KeePassDir "KeePass.exe"))) {
            throw "KeePass.exe reference is missing."
          }

          if (-not (Test-Path (Join-Path $env:KeePassDir "KeePassLib.dll"))) {
            throw "KeePassLib.dll reference is missing."
          }

          msbuild ".\PasswordAlphabetHighlighter.csproj" /restore "/p:KeePassDir=$env:KeePassDir" /p:Configuration=Release /verbosity:minimal

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed with exit code $LASTEXITCODE"
          }

      - name: Upload plugin DLL
        uses: actions/upload-artifact@v4
        with:
          name: PasswordAlphabetHighlighter
          path: |
            bin/Release/*.dll
            **/bin/Release/*.dll
          if-no-files-found: error
