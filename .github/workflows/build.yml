
name: Build KeePass plugin

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Download KeePass 2.58
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          $url = "https://downloads.sourceforge.net/project/keepass/KeePass%202.x/2.58/KeePass-2.58.zip"
          $zip = Join-Path $env:RUNNER_TEMP "KeePass-2.58.zip"
          $dest = Join-Path $env:RUNNER_TEMP "KeePass258"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $zip `
            -MaximumRedirection 10 `
            -UserAgent "Mozilla/5.0"

          $size = (Get-Item $zip).Length
          Write-Host "Downloaded file size: $size bytes"

          if ($size -ne 3225346) {
            $bytes = [System.IO.File]::ReadAllBytes($zip)
            $previewLength = [Math]::Min(200, $bytes.Length)
            Write-Host ([System.Text.Encoding]::UTF8.GetString($bytes, 0, $previewLength))
            throw "Invalid KeePass archive size. Expected 3225346 bytes."
          }

          $sha256 = (Get-FileHash $zip -Algorithm SHA256).Hash
          $expected = "A613CA206FBF5875AD8FE5E440A76418CE01135D3304DC56A0DF12255D83FE07"

          if ($sha256 -ne $expected) {
            throw "KeePass archive SHA-256 verification failed: $sha256"
          }

          Expand-Archive -Path $zip -DestinationPath $dest -Force

          $exe = Get-ChildItem $dest -Filter "KeePass.exe" -Recurse |
            Select-Object -First 1

          if (-not $exe) {
            throw "KeePass.exe not found in archive."
          }

          "KeePassDir=$($exe.Directory.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "KeePass directory: $($exe.Directory.FullName)"

      - name: Build plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          msbuild .\PasswordAlphabetHighlighter.csproj /restore /p:KeePassDir="$env:KeePassDir" /p:Configuration=Release /verbosity:minimal

      - name: Upload plugin DLL
        uses: actions/upload-artifact@v4
        with:
          name: PasswordAlphabetHighlighter
          path: |
            bin/Release/*.dll
            **/bin/Release/*.dll
          if-no-files-found: error
