
name: Build KeePass plugin

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Download official KeePass 2.58
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          $urls = @(
            "https://netix.dl.sourceforge.net/project/keepass/KeePass%202.x/2.58/KeePass-2.58.zip",
            "https://phoenixnap.dl.sourceforge.net/project/keepass/KeePass%202.x/2.58/KeePass-2.58.zip",
            "https://pilotfiber.dl.sourceforge.net/project/keepass/KeePass%202.x/2.58/KeePass-2.58.zip",
            "https://master.dl.sourceforge.net/project/keepass/KeePass%202.x/2.58/KeePass-2.58.zip"
          )

          $zip = Join-Path $env:RUNNER_TEMP "KeePass-2.58.zip"
          $dest = Join-Path $env:RUNNER_TEMP "KeePass258"

          $expectedSize = 3225346
          $expectedHash = "A613CA206FBF5875AD8FE5E440A76418CE01135D3304DC56A0DF12255D83FE07"
          $downloaded = $false

          foreach ($url in $urls) {
            Write-Host ""
            Write-Host "Trying download: $url"

            if (Test-Path $zip) {
              Remove-Item $zip -Force
            }

            & curl.exe --location --fail --silent --show-error --connect-timeout 10 --max-time 60 --output "$zip" "$url"
            $curlExit = $LASTEXITCODE

            if ($curlExit -ne 0) {
              Write-Host "Download failed with curl exit code $curlExit. Trying next mirror."
              continue
            }

            if (-not (Test-Path $zip)) {
              Write-Host "Archive was not created. Trying next mirror."
              continue
            }

            $size = (Get-Item $zip).Length
            Write-Host "Downloaded size: $size bytes"

            if ($size -ne $expectedSize) {
              Write-Host "Unexpected file size. Trying next mirror."
              continue
            }

            $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
            Write-Host "SHA-256: $hash"

            if ($hash -ne $expectedHash) {
              Write-Host "SHA-256 mismatch. Trying next mirror."
              continue
            }

            $downloaded = $true
            Write-Host "Official KeePass archive verified."
            break
          }

          if (-not $downloaded) {
            throw "Unable to download and verify the official KeePass 2.58 archive from the available mirrors."
          }

          Expand-Archive -Path $zip -DestinationPath $dest -Force

          $exe = Get-ChildItem -Path $dest -Filter "KeePass.exe" -File -Recurse |
            Select-Object -First 1

          if (-not $exe) {
            throw "KeePass.exe not found in the verified archive."
          }

          $keepassDir = $exe.Directory.FullName

          "KeePassDir=$keepassDir" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "KeePass directory: $keepassDir"

      - name: Build plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:KeePassDir) {
            throw "KeePassDir is not set."
          }

          msbuild ".\PasswordAlphabetHighlighter.csproj" /restore "/p:KeePassDir=$env:KeePassDir" /p:Configuration=Release /verbosity:minimal

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed with exit code $LASTEXITCODE"
          }

      - name: Upload plugin DLL
        uses: actions/upload-artifact@v4
        with:
          name: PasswordAlphabetHighlighter
          path: bin/Release/PasswordAlphabetHighlighter.dll
          if-no-files-found: error
