name: Build KeePass plugin

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download KeePass 2.58 portable
        shell: pwsh
        run: |
          $url = "https://keepass.info/filepool/KeePass-2.58.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\KeePass-2.58.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\KeePass-2.58.zip" -DestinationPath "$env:RUNNER_TEMP\KeePass258" -Force
          $exe = Get-ChildItem "$env:RUNNER_TEMP\KeePass258" -Filter "KeePass.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw "KeePass.exe was not found in downloaded archive." }
          "KeePassDir=$($exe.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build plugin
        shell: cmd
        run: msbuild PasswordAlphabetHighlighter.csproj /t:Rebuild /p:Configuration=Release /p:KeePassDir="%KeePassDir%"

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: PasswordAlphabetHighlighter-DLL
          path: bin/Release/PasswordAlphabetHighlighter.dll
          if-no-files-found: error
